<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
  <defs>
    <linearGradient id="axe-bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8071E8"/><stop offset="100%" stop-color="#9B8FEF"/></linearGradient>
    <linearGradient id="axe-bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B565C5"/><stop offset="100%" stop-color="#C97ED4"/></linearGradient>
    <linearGradient id="axe-bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7ECFCF"/><stop offset="100%" stop-color="#5BBFBF"/></linearGradient>
    <linearGradient id="axe-bar4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34C48A"/><stop offset="100%" stop-color="#2AAF7A"/></linearGradient>
    <pattern id="axe-stripe" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#1A1A2E"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1E1E35" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="190" fill="#1A1A2E"/>
  <rect width="1200" height="190" fill="url(#axe-stripe)" opacity="0.7"/>

  <!-- CARD 1 — Dev Web -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.8s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="43" y="25" width="240" height="140" rx="20" fill="#8071E8" opacity="0.08"/>
    <rect x="40" y="20" width="240" height="140" rx="20" fill="#16162A" stroke="#8071E8" stroke-opacity="0.5" stroke-width="1.5"/>
    <clipPath id="axe-clip1"><rect x="40" y="20" width="240" height="4" rx="2"/></clipPath>
    <rect x="40" y="20" width="240" height="4" rx="2" fill="url(#axe-bar1)" clip-path="url(#axe-clip1)"/>
    <circle cx="95" cy="95" r="22" fill="none" stroke="#8071E8" stroke-width="2"/>
    <ellipse cx="95" cy="95" rx="10" ry="22" fill="none" stroke="#8071E8" stroke-width="1.5"/>
    <line x1="73" y1="95" x2="117" y2="95" stroke="#8071E8" stroke-width="1.5"/>
    <line x1="76" y1="81" x2="114" y2="81" stroke="#8071E8" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="76" y1="109" x2="114" y2="109" stroke="#8071E8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="162" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F0F5" text-anchor="middle">Dev Web</text>
    <text x="162" y="112" font-family="'Courier New',monospace" font-size="12" fill="#8071E8" text-anchor="middle">React · Node · HTML</text>
  </g>

  <!-- CARD 2 — Cybersécurité -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.8s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="323" y="25" width="240" height="140" rx="20" fill="#B565C5" opacity="0.08"/>
    <rect x="320" y="20" width="240" height="140" rx="20" fill="#16162A" stroke="#B565C5" stroke-opacity="0.5" stroke-width="1.5"/>
    <clipPath id="axe-clip2"><rect x="320" y="20" width="240" height="4" rx="2"/></clipPath>
    <rect x="320" y="20" width="240" height="4" rx="2" fill="url(#axe-bar2)" clip-path="url(#axe-clip2)"/>
    <path d="M375 68 L375 98 Q375 108 385 113 L395 118 L405 113 Q415 108 415 98 L415 68 L395 62 Z" fill="none" stroke="#B565C5" stroke-width="2"/>
    <path d="M385 90 L393 98 L408 80" fill="none" stroke="#B565C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F0F5" text-anchor="middle">Cybersécurité</text>
    <text x="440" y="112" font-family="'Courier New',monospace" font-size="12" fill="#B565C5" text-anchor="middle">Linux · CTF · Réseaux</text>
  </g>

  <!-- CARD 3 — Scripting -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.8s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="603" y="25" width="240" height="140" rx="20" fill="#7ECFCF" opacity="0.08"/>
    <rect x="600" y="20" width="240" height="140" rx="20" fill="#16162A" stroke="#7ECFCF" stroke-opacity="0.5" stroke-width="1.5"/>
    <clipPath id="axe-clip3"><rect x="600" y="20" width="240" height="4" rx="2"/></clipPath>
    <rect x="600" y="20" width="240" height="4" rx="2" fill="url(#axe-bar3)" clip-path="url(#axe-clip3)"/>
    <rect x="632" y="64" width="52" height="40" rx="6" fill="none" stroke="#5BBFBF" stroke-width="2"/>
    <path d="M638 80 L646 87 L638 94" fill="none" stroke="#5BBFBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="650" y1="94" x2="662" y2="94" stroke="#5BBFBF" stroke-width="2" stroke-linecap="round"/>
    <text x="722" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F0F5" text-anchor="middle">Scripting</text>
    <text x="722" y="112" font-family="'Courier New',monospace" font-size="12" fill="#5BBFBF" text-anchor="middle">Python · Bash · CLI</text>
  </g>

  <!-- CARD 4 — Open Source -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.8s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="883" y="25" width="280" height="140" rx="20" fill="#34C48A" opacity="0.08"/>
    <rect x="880" y="20" width="280" height="140" rx="20" fill="#16162A" stroke="#34C48A" stroke-opacity="0.5" stroke-width="1.5"/>
    <clipPath id="axe-clip4"><rect x="880" y="20" width="280" height="4" rx="2"/></clipPath>
    <rect x="880" y="20" width="280" height="4" rx="2" fill="url(#axe-bar4)" clip-path="url(#axe-clip4)"/>
    <circle cx="930" cy="72"  r="7" fill="none" stroke="#34C48A" stroke-width="2"/>
    <circle cx="930" cy="113" r="7" fill="none" stroke="#34C48A" stroke-width="2"/>
    <circle cx="952" cy="90"  r="7" fill="none" stroke="#34C48A" stroke-width="2"/>
    <line x1="930" y1="79" x2="930" y2="106" stroke="#34C48A" stroke-width="1.5"/>
    <path d="M930 79 Q930 90 945 90" fill="none" stroke="#34C48A" stroke-width="1.5"/>
    <text x="1040" y="88" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F0F5" text-anchor="middle">Open Source</text>
    <text x="1040" y="112" font-family="'Courier New',monospace" font-size="12" fill="#34C48A" text-anchor="middle">Git · GitHub · Contrib</text>
  </g>
</svg>
