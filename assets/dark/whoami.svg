<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <pattern id="wai-stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0,0 L 0,28" stroke="#1E1E35" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="#1A1A2E"/>
  <rect width="1200" height="280" fill="url(#wai-stripes)" opacity="1"/>

  <!-- Card shadow -->
  <rect x="46" y="20" width="1112" height="248" rx="14" fill="#8071E8" opacity="0.08"/>
  <!-- Card surface -->
  <rect x="40" y="14" width="1120" height="252" rx="14" fill="#16162A" stroke="#2A2450" stroke-width="1"/>

  <!-- Pill badge -->
  <rect x="56" y="30" width="118" height="28" rx="8" fill="#2A2450"/>
  <text x="71" y="49" font-family="'Courier New',monospace" font-size="13" font-weight="600" fill="#8071E8">$ whoami</text>

  <line x1="56" y1="72" x2="1144" y2="72" stroke="#2A2450" stroke-width="1"/>

  <!-- Col 1 — RÔLE -->
  <text x="56" y="100" font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#6B6B8A">RÔLE</text>
  <text x="56" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#F0F0F5">Développeur Web</text>
  <text x="56" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#8071E8">Full Stack</text>

  <line x1="310" y1="80" x2="310" y2="204" stroke="#2A2450" stroke-width="1"/>

  <!-- Col 2 — FORMATION -->
  <text x="336" y="100" font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#6B6B8A">FORMATION</text>
  <text x="336" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#F0F0F5">Étudiant en</text>
  <text x="336" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#B565C5">Sécurité Informatique</text>

  <line x1="640" y1="80" x2="640" y2="204" stroke="#2A2450" stroke-width="1"/>

  <!-- Col 3 — FOCUS -->
  <text x="666" y="100" font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#6B6B8A">FOCUS</text>
  <text x="666" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#C8C8E0">Web · Scripting</text>
  <text x="666" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#C8C8E0">Cyber · Open Source</text>

  <line x1="960" y1="80" x2="960" y2="204" stroke="#2A2450" stroke-width="1"/>

  <!-- Col 4 — STATUT -->
  <text x="986" y="100" font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#6B6B8A">STATUT</text>
  <rect x="986" y="112" width="156" height="34" rx="8" fill="#0D2A1F"/>
  <rect x="986" y="112" width="156" height="34" rx="8" fill="none" stroke="#34C48A" stroke-width="1"/>
  <text x="1001" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#34C48A">● DISPONIBLE</text>

  <line x1="56" y1="210" x2="1144" y2="210" stroke="#2A2450" stroke-width="1"/>

  <!-- Bio -->
  <text x="56" y="234" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#6B6B8A">Étudiant en sécurité informatique et développeur web basé au Bénin. Passionné par l'innovation,</text>
  <text x="56" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#6B6B8A">les réseaux, la cybersécurité et les interfaces qui ont un impact concret.</text>
</svg>
