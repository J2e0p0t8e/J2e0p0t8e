  <rect x="406" y="0" width="388" height="220" rx="18" fill="url(#pr3-card)" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="406" y="0" width="388" height="4"   rx="2"  fill="url(#pr3-a2)"/>
