  <text x="426" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Bot Discord : gestion des membres,</text>
  <text x="426" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">lecture de musique, lié au site</text>
  <text x="426" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">et au serveur Vision+.</text>
  <rect x="426" y="172" width="80"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="466" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">discord.js</text>
  <rect x="516" y="172" width="80"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="556" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">Node.js</text>
  <rect x="606" y="172" width="70"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="641" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">API</text>

  <!-- ── CARD 3 : MoneyTrack ── -->
  <rect x="812" y="0" width="388" height="220" rx="18" fill="url(#pr3-card)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="812" y="0" width="388" height="4"   rx="2"  fill="url(#pr3-a3)"/>
  <rect x="832" y="18" width="110" height="22" rx="6" fill="#10B981" fill-opacity="0.12"/>
  <text x="887" y="33" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#6EE7B7" text-anchor="middle">App · Finance</text>
  <circle cx="1176" cy="29" r="5" fill="#10B981"/>
  <text x="1166" y="33" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#10B981" text-anchor="end">live</text>
  <text x="832" y="68" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">MoneyTrack</text>
  <text x="832" y="88" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#475569">moneytrack · vercel.app</text>
  <text x="832" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Application de gestion de fonds</text>
  <text x="832" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">et d'économies personnelles.</text>
  <text x="832" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Suivi des dépenses et budgets.</text>
  <rect x="832"  y="172" width="80"  height="22" rx="6" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="872"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#6EE7B7" text-anchor="middle">React</text>
  <rect x="922"  y="172" width="90"  height="22" rx="6" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="967"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#6EE7B7" text-anchor="middle">Tailwind</text>
  <rect x="1022" y="172" width="70"  height="22" rx="6" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1057" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#6EE7B7" text-anchor="middle">Vercel</text>
