<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img">
  <title>Projets — Secureflow, Bot Vision+, MoneyTrack</title>
  <defs>
    <linearGradient id="pr3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="pr3-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16162E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <linearGradient id="pr3-a1" x1="0" x2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pr3-a2" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pr3-a3" x1="0" x2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#pr3-bg)"/>

  <!-- ── CARD 1 : Secureflow ── -->
  <rect x="0"   y="0" width="388" height="220" rx="18" fill="url(#pr3-card)" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="0"   y="0" width="388" height="4"   rx="2"  fill="url(#pr3-a1)"/>
  <rect x="20"  y="18" width="110" height="22" rx="6" fill="#EF4444" fill-opacity="0.12"/>
  <text x="75"  y="33" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#FCA5A5" text-anchor="middle">Hackathon · Sécu</text>
  <!-- quota badge -->
  <rect x="274" y="18" width="94"  height="22" rx="6" fill="#F59E0B" fill-opacity="0.12"/>
  <text x="321" y="33" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#FCD34D" text-anchor="middle">quota IA</text>
  <text x="20" y="68" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Secureflow</text>
  <text x="20" y="88" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#475569">secureflow-zsjq.onrender.com</text>
  <text x="20" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Analyse un repo GitHub, détecte</text>
  <text x="20" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">les failles et propose des correctifs</text>
  <text x="20" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">via IA. Hackathon en équipe.</text>
  <rect x="20"  y="172" width="60"  height="22" rx="6" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="50"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#FCA5A5" text-anchor="middle">IA</text>
  <rect x="90"  y="172" width="80"  height="22" rx="6" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="130" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#FCA5A5" text-anchor="middle">Python</text>
  <rect x="180" y="172" width="90"  height="22" rx="6" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="225" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#FCA5A5" text-anchor="middle">GitHub API</text>

