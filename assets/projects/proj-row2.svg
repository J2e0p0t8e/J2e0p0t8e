  <rect x="516" y="172" width="70"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="551" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">SMS/Mail</text>
  <rect x="596" y="172" width="60"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="626" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">SaaS</text>

