  <text x="882"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#67E8F9" text-anchor="middle">JavaScript</text>
  <rect x="942"  y="172" width="60"  height="22" rx="6" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="972"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#67E8F9" text-anchor="middle">React</text>
  <rect x="1012" y="172" width="70"  height="22" rx="6" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
