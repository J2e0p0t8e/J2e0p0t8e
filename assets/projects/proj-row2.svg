  <text x="832" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">la communauté Vision+.</text>
  <text x="832" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Questions tech, culture &amp; fun.</text>
