<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img">
  <title>Projets — Vision+, IFRI Mentor Link, Jayemail</title>
  <defs>
    <linearGradient id="pr1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="pr1-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16162E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <linearGradient id="pr1-a1" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pr1-a2" x1="0" x2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pr1-a3" x1="0" x2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#pr1-bg)"/>

  <!-- ── CARD 1 : Vision+ ── -->
  <rect x="0"   y="0" width="388" height="220" rx="18" fill="url(#pr1-card)" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="0"   y="0" width="388" height="4"   rx="2"  fill="url(#pr1-a1)"/>
  <!-- badge -->
  <rect x="20"  y="18" width="72"  height="22" rx="6" fill="#6366F1" fill-opacity="0.15"/>
  <text x="56"  y="33" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#818CF8" text-anchor="middle">Web · Blog</text>
  <!-- live badge -->
  <circle cx="352" cy="29" r="5" fill="#10B981"/>
  <text x="342" y="33" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#10B981" text-anchor="end">live</text>
  <!-- title -->
  <text x="20" y="68" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Vision+</text>
  <text x="20" y="88" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#475569">vision-plus.tech</text>
  <!-- desc -->
  <text x="20" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Plateforme communautaire tech avec</text>
  <text x="20" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">blog automatisé. Fondateur &amp; dev.</text>
  <text x="20" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Espace pour apprenants passionnés.</text>
  <!-- tags -->
  <rect x="20"  y="172" width="70"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="55"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">React</text>
  <rect x="100" y="172" width="70"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="135" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">Node.js</text>
  <rect x="180" y="172" width="60"  height="22" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="210" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#818CF8" text-anchor="middle">Blog</text>

  <!-- ── CARD 2 : IFRI Mentor Link ── -->
  <rect x="406" y="0" width="388" height="220" rx="18" fill="url(#pr1-card)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="406" y="0" width="388" height="4"   rx="2"  fill="url(#pr1-a2)"/>
  <rect x="426" y="18" width="110" height="22" rx="6" fill="#8B5CF6" fill-opacity="0.15"/>
  <text x="481" y="33" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#A78BFA" text-anchor="middle">App · Mentorat</text>
  <circle cx="770" cy="29" r="5" fill="#F59E0B"/>
  <text x="760" y="33" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#F59E0B" text-anchor="end">test</text>
  <text x="426" y="68" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">IFRI Mentor Link</text>
  <text x="426" y="88" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#475569">test-web-3fah.onrender.com</text>
  <text x="426" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">App de mentorat — projet intégrateur</text>
  <text x="426" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">de fin d'année à l'IFRI. Backend</text>
  <text x="426" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">principal + partie frontend.</text>
  <rect x="426" y="172" width="80"  height="22" rx="6" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="466" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#A78BFA" text-anchor="middle">Backend</text>
  <rect x="516" y="172" width="80"  height="22" rx="6" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="556" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#A78BFA" text-anchor="middle">Frontend</text>
  <rect x="606" y="172" width="70"  height="22" rx="6" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="641" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#A78BFA" text-anchor="middle">Équipe</text>

  <!-- ── CARD 3 : Jayemail ── -->
  <rect x="812" y="0" width="388" height="220" rx="18" fill="url(#pr1-card)" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="812" y="0" width="388" height="4"   rx="2"  fill="url(#pr1-a3)"/>
  <rect x="832" y="18" width="96"  height="22" rx="6" fill="#06B6D4" fill-opacity="0.12"/>
  <text x="880" y="33" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#67E8F9" text-anchor="middle">Tool · Mail</text>
  <circle cx="1176" cy="29" r="5" fill="#10B981"/>
  <text x="1166" y="33" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#10B981" text-anchor="end">live</text>
  <text x="832" y="68" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Jayemail</text>
  <text x="832" y="88" font-family="'DM Mono','Courier New',monospace" font-size="11" fill="#475569">jephtmail.vercel.app</text>
  <text x="832" y="116" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">Générateur de mails jetables</text>
  <text x="832" y="134" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">via l'API Testmail. Simple,</text>
  <text x="832" y="152" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" fill="#94A3B8">rapide, sans inscription.</text>
  <rect x="832"  y="172" width="100" height="22" rx="6" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="882"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#67E8F9" text-anchor="middle">JavaScript</text>
  <rect x="942"  y="172" width="80"  height="22" rx="6" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="982"  y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#67E8F9" text-anchor="middle">Testmail</text>
  <rect x="1032" y="172" width="70"  height="22" rx="6" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1067" y="187" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#67E8F9" text-anchor="middle">Vercel</text>
</svg>
