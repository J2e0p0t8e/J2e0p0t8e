  <rect x="0" y="216" width="380" height="44" fill="#0F0F1A"/>
  <line x1="0" y1="216" x2="380" y2="216" stroke="#1E293B" stroke-width="1"/>
  <text x="16" y="236" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">MoneyTrack</text>
  <text x="16" y="252" font-family="'DM Mono','Courier New',monospace" font-size="10" fill="#475569">moneytrack-mocha.vercel.app</text>
