      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="mk-clip">
      <rect x="0" y="0" width="380" height="260" rx="16"/>
