<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Stack technique carousel — JAYE</title>
  <desc id="desc">Deux lignes de cartes de stack technique animées.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="55%" stop-color="#13131F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E3F"/>
      <stop offset="100%" stop-color="#16162E"/>
    </linearGradient>
    <linearGradient id="cardBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A35"/>
      <stop offset="100%" stop-color="#130F28"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="20%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6366F1" opacity="0.10"/>
    </pattern>
    <clipPath id="topClip"><rect x="160" y="118" width="700" height="76" rx="14"/></clipPath>
    <clipPath id="botClip"><rect x="160" y="222" width="700" height="76" rx="14"/></clipPath>
  </defs>

  <!-- BG -->
  <rect width="900" height="340" rx="20" fill="url(#bg)"/>
  <rect width="900" height="340" rx="20" fill="url(#dots)"/>
  <rect width="900" height="340" rx="20" fill="url(#glowTop)"/>
  <rect width="900" height="340" rx="20" fill="url(#glowBot)"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="900" height="3" rx="2" fill="url(#accentLine)"/>
  <rect x="0" y="337" width="900" height="3" rx="2" fill="url(#accentLine)"/>

  <!-- Header -->
  <text x="36" y="50" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Stack Technique</text>
  <text x="36" y="78" font-family="'DM Mono', 'Courier New', monospace" font-size="13" fill="#64748B">// Dev Web en haut · Sécurité &amp; Outils en bas</text>

  <!-- alias badge top right -->
  <rect x="776" y="32" width="100" height="28" rx="8" fill="#6366F1" opacity="0.15"/>
  <rect x="776" y="32" width="100" height="28" rx="8" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.5"/>
  <text x="826" y="51" font-family="'DM Mono', 'Courier New', monospace" font-size="13" fill="#818CF8" text-anchor="middle">&lt;.Jaye&gt;</text>

  <!-- Row labels -->
  <text x="36" y="162" font-family="'DM Mono', 'Courier New', monospace" font-size="12" fill="#6366F1">dev</text>
  <text x="36" y="265" font-family="'DM Mono', 'Courier New', monospace" font-size="12" fill="#8B5CF6">sec</text>

  <!-- Track backgrounds -->
