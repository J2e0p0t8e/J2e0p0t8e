<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <defs>
    <style>
      .track { animation: scroll 20s linear infinite; }
      @keyframes scroll {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
    </style>
    <clipPath id="clip"><rect x="10" y="0" width="880" height="110"/></clipPath>
    <linearGradient id="fl" x1="0" x2="1"><stop offset="0%" stop-color="#0D0D0D"/><stop offset="12%" stop-color="#0D0D0D" stop-opacity="0"/></linearGradient>
    <linearGradient id="fr" x1="0" x2="1"><stop offset="88%" stop-color="#0D0D0D" stop-opacity="0"/><stop offset="100%" stop-color="#0D0D0D"/></linearGradient>
  </defs>

  <!-- BG -->
  <rect width="900" height="110" fill="#0D0D0D"/>
  <rect x="2" y="2" width="896" height="106" fill="none" stroke="#C8F135" stroke-width="2"/>
  <rect x="2" y="2" width="6" height="106" fill="#C8F135"/>

  <!-- label -->
  <rect x="28" y="12" width="110" height="18" fill="#C8F135"/>
  <text x="34" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#0D0D0D">STACK TECH</text>

  <!-- scrolling icons -->
  <g clip-path="url(#clip)">
    <g class="track">
      <!-- SET 1 -->
      <image href="https://cdn.simpleicons.org/html5/C8F135"             x="20"   y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/css3/C8F135"              x="80"   y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/javascript/C8F135"        x="140"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/python/C8F135"            x="200"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/git/C8F135"               x="260"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/github/ffffff"            x="320"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/visualstudiocode/C8F135"  x="380"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/figma/C8F135"             x="440"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/nodedotjs/C8F135"         x="500"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/linux/C8F135"             x="560"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/react/C8F135"             x="620"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/tailwindcss/C8F135"       x="680"  y="40" width="40" height="40"/>
      <!-- SET 2 (boucle) -->
      <image href="https://cdn.simpleicons.org/html5/C8F135"             x="760"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/css3/C8F135"              x="820"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/javascript/C8F135"        x="880"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/python/C8F135"            x="940"  y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/git/C8F135"               x="1000" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/github/ffffff"            x="1060" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/visualstudiocode/C8F135"  x="1120" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/figma/C8F135"             x="1180" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/nodedotjs/C8F135"         x="1240" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/linux/C8F135"             x="1300" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/react/C8F135"             x="1360" y="40" width="40" height="40"/>
      <image href="https://cdn.simpleicons.org/tailwindcss/C8F135"       x="1420" y="40" width="40" height="40"/>
    </g>
  </g>

  <!-- fade edges -->
  <rect x="10" y="0" width="880" height="110" fill="url(#fl)"/>
  <rect x="10" y="0" width="880" height="110" fill="url(#fr)"/>
</svg>
