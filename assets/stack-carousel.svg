      <rect x="422"  y="0" width="96"  height="64" rx="12" fill="url(#sc-cardBot)" stroke="#B565C5" stroke-opacity="0.45" stroke-width="1"/><text x="470"  y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">Linux</text>
