<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Stack technique carousel — JAYE</title>
  <desc id="sc-desc">Deux lignes de cartes de stack technique animées.</desc>
  <defs>
    <!-- Card gradients -->
    <linearGradient id="sc-cardTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="sc-cardBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8FF"/>
      <stop offset="100%" stop-color="#FAF0FF"/>
    </linearGradient>
    <!-- Accent bar gradient -->
    <linearGradient id="sc-accentLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#8071E8"/>
      <stop offset="50%"  stop-color="#B565C5"/>
      <stop offset="100%" stop-color="#7ECFCF"/>
    </linearGradient>
    <!-- Diagonal stripe pattern -->
    <pattern id="sc-stripe" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#EBEBF0" stroke-width="2"/>
    </pattern>
    <!-- Clip paths -->
    <clipPath id="sc-topClip"><rect x="160" y="118" width="700" height="76" rx="14"/></clipPath>
    <clipPath id="sc-botClip"><rect x="160" y="222" width="700" height="76" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" fill="#F0F0F5"/>
  <rect width="900" height="340" fill="url(#sc-stripe)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#sc-accentLine)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="337" width="900" height="3" fill="url(#sc-accentLine)"/>

  <!-- Header -->
  <text x="36" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1A2E">Stack Technique</text>
  <text x="36" y="78" font-family="'Courier New',monospace" font-size="13" fill="#6B6B8A">// Dev Web en haut · Sécurité &amp; Outils en bas</text>

  <!-- Badge <.Jaye> -->
  <rect x="776" y="32" width="100" height="28" rx="8" fill="#EDE9FF"/>
  <rect x="776" y="32" width="100" height="28" rx="8" fill="none" stroke="#8071E8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="826" y="51" font-family="'Courier New',monospace" font-size="13" fill="#8071E8" text-anchor="middle">&lt;.Jaye&gt;</text>

  <!-- Row labels -->
  <text x="36" y="162" font-family="'Courier New',monospace" font-size="12" fill="#8071E8">dev</text>
  <text x="36" y="265" font-family="'Courier New',monospace" font-size="12" fill="#B565C5">sec</text>

  <!-- Track backgrounds -->
  <rect x="160" y="118" width="700" height="76" rx="14" fill="#FFFFFF" stroke="#DCDCE8" stroke-width="1"/>
  <rect x="160" y="222" width="700" height="76" rx="14" fill="#FFFFFF" stroke="#DCDCE8" stroke-width="1"/>

