      <rect x="630"  y="0" width="108" height="64" rx="12" fill="url(#sc-cardBot)" stroke="#B565C5" stroke-opacity="0.45" stroke-width="1"/><text x="684"  y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">Scripting</text>
      <rect x="754"  y="0" width="108" height="64" rx="12" fill="url(#sc-cardBot)" stroke="#B565C5" stroke-opacity="0.45" stroke-width="1"/><text x="808"  y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">Wireshark</text>
