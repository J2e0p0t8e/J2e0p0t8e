      <rect x="400"  y="0" width="120" height="64" rx="12" fill="url(#sc-cardTop)" stroke="#8071E8" stroke-opacity="0.45" stroke-width="1"/><text x="460"  y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">HTML/CSS</text>
      <rect x="536"  y="0" width="140" height="64" rx="12" fill="url(#sc-cardTop)" stroke="#8071E8" stroke-opacity="0.45" stroke-width="1"/><text x="606"  y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">Tailwind CSS</text>
