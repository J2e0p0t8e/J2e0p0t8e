      <rect x="2206" y="0" width="110" height="64" rx="12" fill="url(#sc-cardTop)" stroke="#8071E8" stroke-opacity="0.45" stroke-width="1"/><text x="2261" y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">GitHub</text>
