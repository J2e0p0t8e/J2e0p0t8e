      <rect x="1416" y="0" width="130" height="64" rx="12" fill="url(#sc-cardTop)" stroke="#8071E8" stroke-opacity="0.45" stroke-width="1"/><text x="1481" y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">JavaScript</text>
      <rect x="1562" y="0" width="104" height="64" rx="12" fill="url(#sc-cardTop)" stroke="#8071E8" stroke-opacity="0.45" stroke-width="1"/><text x="1614" y="41" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#1A1A2E">Python</text>
