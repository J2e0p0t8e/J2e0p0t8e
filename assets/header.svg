<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="200" fill="#0D0D0D"/>

  <!-- brutal grid lines -->
  <line x1="0" y1="40"  x2="900" y2="40"  stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="80"  x2="900" y2="80"  stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="750" y1="0" x2="750" y2="200" stroke="#1A1A1A" stroke-width="1"/>

  <!-- accent block left -->
  <rect x="0" y="0" width="8" height="200" fill="#C8F135"/>

  <!-- accent block top -->
  <rect x="0" y="0" width="900" height="5" fill="#C8F135"/>

  <!-- accent block bottom -->
  <rect x="0" y="195" width="900" height="5" fill="#C8F135"/>

  <!-- tag -->
  <rect x="28" y="20" width="100" height="22" fill="#C8F135"/>
  <text x="34" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#0D0D0D">JAYE.DEV</text>

  <!-- name -->
  <text x="28" y="105" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-2">JEPHTE</text>
  <text x="28" y="155" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#C8F135" letter-spacing="-2">AHIFFON</text>

  <!-- right side info -->
  <text x="650" y="75"  font-family="'Courier New', monospace" font-size="11" fill="#666666">ALIAS</text>
  <text x="650" y="95"  font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#C8F135">JAYE</text>

  <text x="650" y="125" font-family="'Courier New', monospace" font-size="11" fill="#666666">LOCALISATION</text>
  <text x="650" y="145" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFFFFF">BENIN / AFRIQUE</text>

  <text x="650" y="172" font-family="'Courier New', monospace" font-size="11" fill="#666666">STATUT</text>
  <text x="650" y="190" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#C8F135">DISPONIBLE ●</text>
</svg>
