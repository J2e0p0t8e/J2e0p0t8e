<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>

    <!-- Diagonal stripe pattern -->
    <pattern id="hdr-stripes" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="32" stroke="#EBEBF0" stroke-width="3"/>
    </pattern>

    <!-- Top / bottom accent bar gradient -->
    <linearGradient id="hdr-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8071E8"/>
      <stop offset="50%"  stop-color="#B565C5"/>
      <stop offset="100%" stop-color="#7ECFCF"/>
    </linearGradient>

    <!-- Gradient fill for JEPHTE -->
    <linearGradient id="hdr-grad-jephte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6B5ED4"/>
      <stop offset="100%" stop-color="#8071E8"/>
    </linearGradient>

    <!-- Gradient fill for AHIFFON -->
    <linearGradient id="hdr-grad-ahiffon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B565C5"/>
      <stop offset="100%" stop-color="#D07ADE"/>
    </linearGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="300" fill="#F0F0F5"/>
  <rect width="1200" height="300" fill="url(#hdr-stripes)" opacity="0.9"/>

  <!-- ── Top accent bar ── -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#hdr-accent)"/>

  <!-- ══════════════ LEFT SIDE ══════════════ -->

  <!-- Tag pill: <.Jaye> — Courier New comme avant -->
  <rect x="60" y="34" width="98" height="26" rx="13" fill="#EDE9FF"/>
  <text x="76" y="52"
        font-family="'Courier New',monospace"
        font-size="12" fill="#8071E8">&lt;.Jaye&gt;</text>

  <!-- JEPHTE — Impact ultra-condensé -->
  <text x="58" y="180"
        font-family="Impact,'Arial Black','Arial Narrow',sans-serif"
        font-size="92" font-weight="900" letter-spacing="6"
        fill="url(#hdr-grad-jephte)">JEPHTE</text>

  <!-- AHIFFON — Impact légèrement plus petit, décalé -->
  <text x="58" y="262"
        font-family="Impact,'Arial Black','Arial Narrow',sans-serif"
        font-size="78" font-weight="900" letter-spacing="10"
        fill="url(#hdr-grad-ahiffon)">AHIFFON</text>

  <!-- Trait décoratif sous JEPHTE -->
  <rect x="60" y="188" width="520" height="3" rx="2" fill="url(#hdr-accent)" opacity="0.4"/>

  <!-- ══════════════ RIGHT SIDE ══════════════ -->

  <!-- Available badge -->
  <circle cx="1072" cy="52" r="5" fill="#3DBF82"/>
  <text x="1085" y="57"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" fill="#3DBF82" font-weight="600">Disponible</text>

  <!-- // alias — Trebuchet MS pour les labels de droite -->
  <text x="780" y="105"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="10" fill="#9B99B8" letter-spacing="2" font-style="italic">// alias</text>
  <text x="780" y="145"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="42" font-weight="900" letter-spacing="3"
        fill="#1A1A2E">JAYE</text>

  <!-- // domaines -->
  <text x="780" y="175"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="10" fill="#9B99B8" letter-spacing="2" font-style="italic">// domaines</text>
  <text x="780" y="199"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="17" fill="#1A1A2E" font-weight="600">Dev Web · Cybersécurité</text>

  <!-- // localisation -->
  <text x="780" y="227"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="10" fill="#9B99B8" letter-spacing="2" font-style="italic">// localisation</text>
  <text x="780" y="251"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="17" fill="#1A1A2E" font-weight="600">Bénin — Afrique de l'Ouest</text>

  <!-- ── Bottom accent bar ── -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#hdr-accent)"/>

</svg>
