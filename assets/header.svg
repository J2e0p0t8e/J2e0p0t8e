  <!-- bottom border -->
  <rect x="0" y="195" width="900" height="5" fill="#7B61FF"/>

  <!-- tag top-left -->
  <rect x="22" y="16" width="90" height="20" fill="#00FF94"/>
  <text x="28" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#0A0E1A">JAYE.DEV</text>

  <!-- right: lock icon area (cybersec) -->
  <rect x="820" y="14" width="66" height="22" fill="#7B61FF"/>
  <text x="826" y="29" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FFFFFF">SEC ▲</text>

  <!-- name -->
  <text x="22" y="105" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#FFFFFF"    letter-spacing="-2">JEPHTE</text>
  <text x="22" y="160" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#00FF94" letter-spacing="-2">AHIFFON</text>

  <!-- right panel -->
  <text x="640" y="72"  font-family="'Courier New', monospace" font-size="10" fill="#4B5563">ALIAS</text>
  <text x="640" y="92"  font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#00FF94">JAYE</text>

  <text x="640" y="118" font-family="'Courier New', monospace" font-size="10" fill="#4B5563">DOMAINES</text>
  <text x="640" y="136" font-family="'Courier New', monospace" font-size="12" fill="#FFFFFF">Dev Web · Cybersec</text>

  <text x="640" y="158" font-family="'Courier New', monospace" font-size="10" fill="#4B5563">LOCALISATION</text>
  <text x="640" y="176" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF">BÉNIN — AFRIQUE</text>

  <text x="640" y="196" font-family="'Courier New', monospace" font-size="11" fill="#00FF94">● DISPONIBLE</text>
