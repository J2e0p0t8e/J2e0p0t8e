<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="55%" stop-color="#13131F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6366F1" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <rect width="1200" height="280" fill="url(#glow1)"/>
  <rect width="1200" height="280" fill="url(#glow2)"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>
  <defs>
    <linearGradient id="accentLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- tag -->
  <rect x="60" y="40" width="160" height="32" rx="8" fill="#6366F1" opacity="0.15"/>
  <rect x="60" y="40" width="160" height="32" rx="8" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.5"/>
  <text x="76" y="61" font-family="'DM Mono', 'Courier New', monospace" font-size="13" fill="#818CF8">&lt;.Jaye&gt;</text>

  <!-- available badge -->
  <circle cx="1050" cy="56" r="5" fill="#10B981"/>
  <text x="1064" y="61" font-family="'DM Mono', 'Courier New', monospace" font-size="13" fill="#10B981">Disponible</text>

  <!-- name -->
  <text x="60" y="148" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-2">JEPHTE</text>
  <text x="60" y="222" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="#6366F1">AHIFFON</tspan>
  </text>

  <!-- right panel -->
  <text x="800" y="110" font-family="'DM Mono', 'Courier New', monospace" font-size="11" fill="#64748B">// alias</text>
  <text x="800" y="140" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">JAYE</text>

  <text x="800" y="175" font-family="'DM Mono', 'Courier New', monospace" font-size="11" fill="#64748B">// domaines</text>
  <text x="800" y="198" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" fill="#CBD5E1">Dev Web  ·  Cybersécurité</text>

  <text x="800" y="228" font-family="'DM Mono', 'Courier New', monospace" font-size="11" fill="#64748B">// localisation</text>
  <text x="800" y="251" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">Bénin — Afrique de l'Ouest</text>

  <!-- bottom accent -->
  <rect x="0" y="277" width="1200" height="3" fill="url(#accentLine)"/>
</svg>
