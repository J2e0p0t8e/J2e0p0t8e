<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">

  <!-- BG -->
  <rect width="900" height="200" fill="#0A0E1A"/>

  <!-- grid lines subtle -->
  <line x1="0" y1="40"  x2="900" y2="40"  stroke="#111827" stroke-width="1"/>
  <line x1="0" y1="80"  x2="900" y2="80"  stroke="#111827" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#111827" stroke-width="1"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#111827" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#111827" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#111827" stroke-width="1"/>

  <!-- top accent bar: tricolore brutal -->
  <rect x="0"   y="0" width="300" height="5" fill="#00FF94"/>
  <rect x="300" y="0" width="300" height="5" fill="#7B61FF"/>
  <rect x="600" y="0" width="300" height="5" fill="#FF4D6D"/>

  <!-- left accent bar -->
