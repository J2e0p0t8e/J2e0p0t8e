<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90">
  <defs>
    <linearGradient id="ftr-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8071E8"/>
      <stop offset="50%"  stop-color="#B565C5"/>
      <stop offset="100%" stop-color="#7ECFCF"/>
    </linearGradient>
    <!-- Stripe subtle pour le background -->
    <pattern id="ftr-stripe" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#F0F0F5"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#EBEBF0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="90" fill="#F0F0F5"/>
  <rect width="1200" height="90" fill="url(#ftr-stripe)" opacity="0.8"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#ftr-accent)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="86" width="1200" height="4" fill="url(#ftr-accent)"/>

  <!-- Nom — Georgia serif, classe et lisibilité -->
  <text x="600" y="36"
        font-family="Georgia,'Times New Roman',serif"
        font-size="16" font-weight="700" font-style="italic"
        fill="#8071E8" text-anchor="middle" letter-spacing="2">JAYE · JEPHTE AHIFFON · BÉNIN</text>

  <!-- Tagline — Trebuchet MS, doux et moderne -->
  <text x="600" y="62"
        font-family="'Trebuchet MS','Segoe UI',sans-serif"
        font-size="13" fill="#6B6B8A" text-anchor="middle">Merci d'être passé — n'hésite pas à laisser une étoile ✦</text>

  <!-- Petit séparateur central décoratif -->
  <line x1="540" y1="72" x2="660" y2="72" stroke="#DCDCE8" stroke-width="1"/>
  <!-- Dot central -->
  <circle cx="600" cy="72" r="2.5" fill="#B565C5" opacity="0.5"/>
</svg>
