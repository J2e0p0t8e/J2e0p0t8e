<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="axe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="axe-c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E3F"/>
      <stop offset="100%" stop-color="#16162E"/>
    </linearGradient>
    <linearGradient id="axe-c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1535"/>
      <stop offset="100%" stop-color="#110F28"/>
    </linearGradient>
    <linearGradient id="axe-c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1E2A"/>
      <stop offset="100%" stop-color="#0A1520"/>
    </linearGradient>
    <linearGradient id="axe-c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1F1A"/>
      <stop offset="100%" stop-color="#0F1A0F"/>
    </linearGradient>
    <filter id="axe-glow1"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="axe-glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="axe-glow3"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="axe-glow4"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="180" fill="url(#axe-bg)"/>

  <!-- ── CARD 1 : Dev Web — bounce first ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="40"  y="30" width="240" height="120" rx="20" fill="url(#axe-c1)" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="40"  y="30" width="240" height="4"   rx="2"  fill="#6366F1"/>
    <!-- globe icon -->
    <circle cx="95" cy="90" r="22" fill="none" stroke="#6366F1" stroke-width="2" filter="url(#axe-glow1)"/>
    <ellipse cx="95" cy="90" rx="10" ry="22" fill="none" stroke="#6366F1" stroke-width="1.5"/>
    <line x1="73" y1="90" x2="117" y2="90" stroke="#6366F1" stroke-width="1.5"/>
    <line x1="76" y1="76" x2="114" y2="76" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="76" y1="104" x2="114" y2="104" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6"/>
    <text x="162" y="84" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle">Dev Web</text>
    <text x="162" y="108" font-family="'DM Mono','Courier New',monospace" font-size="12" fill="#6366F1" text-anchor="middle">React · Node · HTML</text>
  </g>

  <!-- ── CARD 2 : Cybersécurité — bounce second (delay) ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.8s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="320" y="30" width="240" height="120" rx="20" fill="url(#axe-c2)" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="320" y="30" width="240" height="4"   rx="2"  fill="#8B5CF6"/>
    <!-- shield icon -->
    <path d="M375 68 L375 98 Q375 108 385 113 L395 118 L405 113 Q415 108 415 98 L415 68 L395 62 Z" fill="none" stroke="#8B5CF6" stroke-width="2" filter="url(#axe-glow2)"/>
    <path d="M385 90 L393 98 L408 80" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="84" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle">Cybersécurité</text>
    <text x="440" y="108" font-family="'DM Mono','Courier New',monospace" font-size="12" fill="#8B5CF6" text-anchor="middle">Linux · CTF · Réseaux</text>
  </g>

  <!-- ── CARD 3 : Scripting — bounce third ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.8s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="600" y="30" width="240" height="120" rx="20" fill="url(#axe-c3)" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="600" y="30" width="240" height="4"   rx="2"  fill="#06B6D4"/>
    <!-- terminal icon -->
    <rect x="632" y="64" width="52" height="40" rx="6" fill="none" stroke="#06B6D4" stroke-width="2" filter="url(#axe-glow3)"/>
    <path d="M638 80 L646 87 L638 94" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="650" y1="94" x2="662" y2="94" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <text x="722" y="84" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle">Scripting</text>
    <text x="722" y="108" font-family="'DM Mono','Courier New',monospace" font-size="12" fill="#06B6D4" text-anchor="middle">Python · Bash · CLI</text>
  </g>

  <!-- ── CARD 4 : Open Source — bounce fourth ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.8s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="880" y="30" width="280" height="120" rx="20" fill="url(#axe-c4)" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="880" y="30" width="280" height="4"   rx="2"  fill="#10B981"/>
    <!-- git branch icon -->
    <circle cx="930" cy="72" r="7"  fill="none" stroke="#10B981" stroke-width="2" filter="url(#axe-glow4)"/>
    <circle cx="930" cy="108" r="7" fill="none" stroke="#10B981" stroke-width="2"/>
    <circle cx="950" cy="90"  r="7" fill="none" stroke="#10B981" stroke-width="2"/>
    <line x1="930" y1="79"  x2="930" y2="101" stroke="#10B981" stroke-width="1.5"/>
    <path d="M930 79 Q930 90 943 90" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="1040" y="84" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle">Open Source</text>
    <text x="1040" y="108" font-family="'DM Mono','Courier New',monospace" font-size="12" fill="#10B981" text-anchor="middle">Git · GitHub · Contrib</text>
  </g>
</svg>
